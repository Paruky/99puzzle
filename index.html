<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99puzzle</title>
    <style>
        .tile{
            width: 40px;
            height: 40px;
            border: 1px solid blue;
            border-radius: 6px;
            text-align: center;
            font-size: 20px;
            background-color: white;
            box-shadow: rgb(128, 128, 128) 3px 3px;
        }
    </style>
    <script>
        "use strict";

        const tiles = [];

        function init() {
            let table = document.getElementById("table")
            
            for (let i = 0; i < 10; i++) {
                let tr = document.createElement("tr")
                for (let j = 0; j < 10; j++) {
                    let td = document.createElement("td")
                    let index = i * 10 + j
                    td.className = "tile"
                    td.index = index
                    td.value = index
                    td.textContent = index == 0 ? "" : index
                    td.onclick = click
                    td.addEventListener('touchstart', click)
                    tr.appendChild(td)
                    tiles.push(td)
                }
                table.appendChild(tr)
            }

            for (let i = 0; i < 1000000; i++) {
                click({ target: {index: Math.floor(Math.random() * 100)}})
            }
        }

        function click(e) {
            let i = e.target.index
            if (i - 10 >= 0 && tiles[i - 10].value == 0) {
                swap(i, i - 10)
            } else if (i + 10 < 100 && tiles[i + 10].value == 0) {
                swap(i, i + 10)
            } else if (i % 10 != 0 && tiles[i - 1].value == 0) {
                swap(i, i - 1)
            } else if (i % 10 != 9 && tiles[i + 1].value == 0) {
                swap(i, i + 1)
            }
        }

        function swap(i, j) {
            let tmp = tiles[i].value
            tiles[i].textContent = tiles[j].textContent
            tiles[i].value = tiles[j].value
            tiles[j].textContent = tmp
            tiles[j].value = tmp
        }
    </script>
</head>
<body onload="init()">
    <table id="table"></table>
</body>
</html>
