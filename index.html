<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99puzzle</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .contentGroup {
            margin: 0;
            min-height: 95vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .searchGroup {
            margin: 0 auto;
            width: 33vw;
            height: 5vh;
            justify-content: center;
            align-items: center;
        }
        #search {
            width: 10vw;
            height: 5vh;
            font-size: 2vw;
            margin: 0 auto;
        }
        #findCtx {
            width: 5em;
            height: 3vh;
            font-size: 2vw;
            margin: 0 auto;
        }
        .tile {
            width: 10vw;
            height: 10vw;
            font-size: 4vw;
            border: 1.5px solid #aaa;
            border-radius: 4px;
            text-align: center;
            background-color: #fff;
            font-family: "Roboto", "Noto Sans JP", sans-serif;
        }
        #table {
            border-collapse: collapse;
        }
        @media (min-width: 768px) {
            .tile{
                width: 60px;
                height: 60px;
                font-size: 23px;
            }
        }

        .scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
    <script>
        "use strict";

        const tiles = [];

        function init() {
            let table = document.getElementById("table")

            for (let i = 0; i < 10; i++) {
                let tr = document.createElement("tr")
                for (let j = 0; j < 10; j++) {
                    let td = document.createElement("td")
                    let index = i * 10 + j
                    td.className = "tile"
                    td.index = index
                    td.value = index
                    td.textContent = index == 0 ? "" : index
                    td.onclick = click
                    td.addEventListener('touchstart', click)
                    tr.appendChild(td)
                    tiles.push(td)
                }
                table.appendChild(tr)
            }

            for (let i = 0; i < 1000000; i++) {
                click({ target: {index: Math.floor(Math.random() * 100)}})
            }
        }

        function click(e) {
            let i = e.target.index
            if (i - 10 >= 0 && tiles[i - 10].value == 0) {
                swap(i, i - 10)
            } else if (i + 10 < 100 && tiles[i + 10].value == 0) {
                swap(i, i + 10)
            } else if (i % 10 != 0 && tiles[i - 1].value == 0) {
                swap(i, i - 1)
            } else if (i % 10 != 9 && tiles[i + 1].value == 0) {
                swap(i, i + 1)
            }
        }

        function swap(i, j) {
            let tmp = tiles[i].value
            tiles[i].textContent = tiles[j].textContent
            tiles[i].value = tiles[j].value
            tiles[j].textContent = tmp
            tiles[j].value = tmp
            tiles[i].style.backgroundColor = "#fff"
        }

        function find() {
            let findNumber = document.getElementById("findCtx").value
            for (let i=0;i<100;i++) {
                if(tiles[i].textContent == findNumber) {
                tiles[i].style.backgroundColor = "#fcd381"    
                }else {
                    tiles[i].style.backgroundColor = "#fff"
                }
            }
        }
    </script>
</head>
<body onload="init()">
    <div class="searchGroup">
        <button id="search" onclick="find()">検索</button>
        <input type="number" id="findCtx" min="0" max="99">
    </div>
    <div class="contentGroup">
        <table id="table"></table>
    </div>
</body>
</html>
